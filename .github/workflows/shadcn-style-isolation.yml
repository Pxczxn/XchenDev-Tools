name: One-shot shadcn Style Isolation

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/shadcn-style-isolation.yml"

permissions:
  contents: write

jobs:
  isolate:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Isolate legacy control styles
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("src/styles/app.css")
          text = p.read_text(encoding="utf-8")
          replacements = {
              "button,\n.btn {": "button:not([data-slot=\"button\"]),\n.btn {",
              "button:hover:not(:disabled) {": "button:not([data-slot=\"button\"]):hover:not(:disabled) {",
              "button.secondary {": "button.secondary:not([data-slot=\"button\"]) {",
              "button.secondary:hover:not(:disabled) {": "button.secondary:not([data-slot=\"button\"]):hover:not(:disabled) {",
              "button.btn-sm {": "button.btn-sm:not([data-slot=\"button\"]) {",
              "button:disabled {": "button:not([data-slot=\"button\"]):disabled {",
              "button:focus-visible,\ninput:focus-visible,": "button:not([data-slot=\"button\"]):focus-visible,\ninput:not([data-slot=\"input\"]):focus-visible,",
              "input,\nselect {": "input:not([data-slot=\"input\"]),\nselect {",
              "input:focus,\nselect:focus {": "input:not([data-slot=\"input\"]):focus,\nselect:focus {",
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match for {old!r}, found {count}")
              text = text.replace(old, new, 1)

          p.write_text(text, encoding="utf-8", newline="\n")
          PY

      - name: Install dependencies
        run: npm ci

      - name: Frontend tests
        run: npm test

      - name: Frontend build
        run: npm run build

      - name: Commit isolation
        shell: pwsh
        run: |
          git config user.name "XchenDev"
          git config user.email "Pxczxn@163.com"
          git add src/styles/app.css
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "【ui】隔离 shadcn 与旧控件全局样式"
            git push
          }
