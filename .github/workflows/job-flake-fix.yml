name: One-shot Job Timing Fix

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/job-flake-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Widen descendant observation window
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("src-tauri/src/command_runner/mod.rs")
          text = p.read_text(encoding="utf-8")
          old = "setTimeout(function(){process.exit(0)},800)"
          new = "setTimeout(function(){process.exit(0)},3000)"
          if text.count(old) != 1:
              raise SystemExit(f"expected one timing marker, found {text.count(old)}")
          p.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")
          PY

      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Rust clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Repeat natural-exit job test
        shell: pwsh
        run: |
          1..3 | ForEach-Object {
            Write-Host "Job timing verification run $_/3"
            cargo test --locked --manifest-path src-tauri/Cargo.toml command_runner::tests::natural_root_exit_closes_job_and_kills_remaining_descendants -- --exact --test-threads=1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Commit fix
        shell: pwsh
        run: |
          git config user.name "XchenDev"
          git config user.email "Pxczxn@163.com"
          git add src-tauri/src/command_runner/mod.rs
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "【test】放宽 Windows Job 子进程观察窗口"
            git push
          } else {
            Write-Host "No changes"
          }
