name: One-shot Clippy Manual Fix

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/clippy-manual-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Apply exact Clippy fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} match(es), found {actual} for {old!r}")
              p.write_text(text.replace(old, new, count), encoding="utf-8", newline="\n")

          replace_exact(
              "src-tauri/src/command_runner/windows_job.rs",
              "        let mut si = STARTUPINFOW::default();\n        si.cb = size_of::<STARTUPINFOW>() as u32;",
              "        let si = STARTUPINFOW {\n            cb: size_of::<STARTUPINFOW>() as u32,\n            ..Default::default()\n        };",
          )

          replace_exact(
              "src-tauri/src/config_store/mod.rs",
              "fn load_or_default(path: &PathBuf) -> AppConfig {",
              "fn load_or_default(path: &Path) -> AppConfig {",
          )
          replace_exact(
              "src-tauri/src/config_store/mod.rs",
              "fn persist(path: &PathBuf, config: &AppConfig) -> Result<(), String> {",
              "fn persist(path: &Path, config: &AppConfig) -> Result<(), String> {",
          )
          replace_exact(
              "src-tauri/src/config_store/mod.rs",
              "        let mut future = AppConfig::default();\n        future.version = CURRENT_CONFIG_VERSION + 1;",
              "        let future = AppConfig {\n            version: CURRENT_CONFIG_VERSION + 1,\n            ..Default::default()\n        };",
          )
          replace_exact(
              "src-tauri/src/config_store/mod.rs",
              "        let mut invalid_primary = AppConfig::default();\n        invalid_primary.version = CURRENT_CONFIG_VERSION + 1;",
              "        let invalid_primary = AppConfig {\n            version: CURRENT_CONFIG_VERSION + 1,\n            ..Default::default()\n        };",
          )

          replace_exact(
              "src-tauri/src/settings_guard.rs",
              "        let mut settings = AppSettings::default();\n        settings.extra_protected_process_names =\n            vec![\" node.exe \".to_string(), \"NODE.EXE\".to_string()];\n        settings.disabled_runtime_kinds = vec![\" JAVA \".to_string(), \"java\".to_string()];\n        settings.managed_service_kinds = vec![\" Redis \".to_string()];",
              "        let mut settings = AppSettings {\n            extra_protected_process_names: vec![\n                \" node.exe \".to_string(),\n                \"NODE.EXE\".to_string(),\n            ],\n            disabled_runtime_kinds: vec![\" JAVA \".to_string(), \"java\".to_string()],\n            managed_service_kinds: vec![\" Redis \".to_string()],\n            ..Default::default()\n        };",
          )
          replace_exact(
              "src-tauri/src/settings_guard.rs",
              "        let mut settings = AppSettings::default();\n        settings.log_retention_days = 0;",
              "        let settings = AppSettings {\n            log_retention_days: 0,\n            ..Default::default()\n        };",
          )
          replace_exact(
              "src-tauri/src/settings_guard.rs",
              "        let mut settings = AppSettings::default();\n        settings.disabled_runtime_kinds = vec![\"go\".to_string()];",
              "        let settings = AppSettings {\n            disabled_runtime_kinds: vec![\"go\".to_string()],\n            ..Default::default()\n        };",
          )
          replace_exact(
              "src-tauri/src/settings_guard.rs",
              "        let mut settings = AppSettings::default();\n        settings.extra_protected_process_names = vec![\"C:\\\\Windows\\\\cmd.exe\".to_string()];",
              "        let settings = AppSettings {\n            extra_protected_process_names: vec![\"C:\\\\Windows\\\\cmd.exe\".to_string()],\n            ..Default::default()\n        };",
          )
          PY

      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Rust clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml -- --test-threads=1

      - name: Commit fixes
        shell: pwsh
        run: |
          git config user.name "XchenDev"
          git config user.email "Pxczxn@163.com"
          git add src-tauri
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "【clippy】清理剩余 Rust lint"
            git push
          } else {
            Write-Host "No changes"
          }
