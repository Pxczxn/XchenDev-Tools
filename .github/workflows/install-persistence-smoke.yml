name: One-shot Install Persistence Smoke

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/install-persistence-smoke.yml"

permissions:
  contents: write

jobs:
  install-persistence:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Isolate installed config directory
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path("src-tauri/src/config_store/mod.rs"): [
                  (
                      r'%LOCALAPPDATA%\XchenDev-Tools\config\config.json',
                      r'%LOCALAPPDATA%\XchenDev\XchenDev-Tools\config\config.json',
                  ),
                  (
                      '        return PathBuf::from(local).join("XchenDev-Tools");',
                      '        return PathBuf::from(local).join("XchenDev").join("XchenDev-Tools");',
                  ),
                  (
                      '            PathBuf::from("C:\\\\Users\\\\demo\\\\AppData\\\\Local").join("XchenDev-Tools")',
                      '            PathBuf::from("C:\\\\Users\\\\demo\\\\AppData\\\\Local")\n                .join("XchenDev")\n                .join("XchenDev-Tools")',
                  ),
              ],
              Path("src/pages/SettingsPage.tsx"): [
                  (
                      r'%LOCALAPPDATA%\XchenDev-Tools\config',
                      r'%LOCALAPPDATA%\XchenDev\XchenDev-Tools\config',
                  ),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"{path}: expected one match for {old!r}, found {count}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8", newline="\n")
          PY

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend tests
        run: npm test

      - name: Frontend build
        run: npm run build

      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Rust format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Rust clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml -- --test-threads=1

      - name: Build NSIS installer
        run: npm run tauri build -- --bundles nsis

      - name: Silent install and uninstall preserves user data
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" -File | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found" }

          $installDir = Join-Path $env:LOCALAPPDATA "XchenDev-Tools"
          $dataRoot = Join-Path $env:LOCALAPPDATA "XchenDev\XchenDev-Tools"
          $sentinel = Join-Path $dataRoot "config\persist-after-uninstall.txt"

          Remove-Item -Recurse -Force $installDir -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force $dataRoot -ErrorAction SilentlyContinue

          $installProcess = Start-Process -FilePath $installer.FullName -ArgumentList "/S" -PassThru
          if (-not $installProcess.WaitForExit(120000)) {
            $installProcess.Kill()
            throw "silent installer timed out"
          }
          if ($installProcess.ExitCode -ne 0) {
            throw "silent installer failed with exit code $($installProcess.ExitCode)"
          }

          $appExe = Join-Path $installDir "xchendev-tools.exe"
          $uninstaller = Join-Path $installDir "uninstall.exe"
          if (-not (Test-Path $appExe)) { throw "installed app executable not found at $appExe" }
          if (-not (Test-Path $uninstaller)) { throw "uninstaller not found at $uninstaller" }

          if ($dataRoot.Equals($installDir, [System.StringComparison]::OrdinalIgnoreCase) -or
              $dataRoot.StartsWith($installDir + "\", [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "user data directory is still inside install directory"
          }

          New-Item -ItemType Directory -Force (Split-Path $sentinel) | Out-Null
          "keep-me" | Set-Content -Encoding ascii $sentinel

          $uninstallProcess = Start-Process -FilePath $uninstaller -ArgumentList "/S", "_?=$installDir" -PassThru
          if (-not $uninstallProcess.WaitForExit(120000)) {
            $uninstallProcess.Kill()
            throw "silent uninstaller timed out"
          }
          if ($uninstallProcess.ExitCode -ne 0) {
            throw "silent uninstaller failed with exit code $($uninstallProcess.ExitCode)"
          }
          Start-Sleep -Seconds 2

          if (Test-Path $appExe) { throw "application executable survived uninstall" }
          if (-not (Test-Path $sentinel)) { throw "user data was deleted by uninstall" }

          Write-Host "Install dir removed safely: $installDir"
          Write-Host "User data preserved: $sentinel"

      - name: Prepare installer checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" -File | Select-Object -First 1
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -Encoding ascii installer-sha256.txt

      - name: Upload verified installer
        uses: actions/upload-artifact@v7
        with:
          name: XchenDev-Tools-NSIS-persistence-smoke
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            installer-sha256.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Commit config path isolation
        shell: pwsh
        run: |
          git config user.name "XchenDev"
          git config user.email "Pxczxn@163.com"
          git add src-tauri/src/config_store/mod.rs src/pages/SettingsPage.tsx
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "【fix】隔离安装目录与用户配置目录"
            git push
          }
