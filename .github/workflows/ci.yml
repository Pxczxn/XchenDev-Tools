name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Version consistency check
        shell: bash
        run: |
          python - <<'PY'
          import json
          import tomllib
          from pathlib import Path

          package_version = json.loads(Path("package.json").read_text(encoding="utf-8"))["version"]
          tauri_version = json.loads(Path("src-tauri/tauri.conf.json").read_text(encoding="utf-8"))["version"]
          cargo = tomllib.loads(Path("src-tauri/Cargo.toml").read_text(encoding="utf-8"))
          cargo_version = cargo["package"]["version"]

          versions = {
              "package.json": package_version,
              "src-tauri/Cargo.toml": cargo_version,
              "src-tauri/tauri.conf.json": tauri_version,
          }
          if len(set(versions.values())) != 1:
              details = ", ".join(f"{path}={version}" for path, version in versions.items())
              raise SystemExit(f"version mismatch: {details}")

          print(f"version OK: {package_version}")
          PY

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend dependency audit
        run: npm audit --audit-level=moderate

      - name: Frontend tests
        run: npm test

      - name: Frontend build
        run: npm run build

      - name: Rust format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Rust clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml -- --test-threads=1

      - name: Tauri application build
        run: npm run tauri build -- --no-bundle
