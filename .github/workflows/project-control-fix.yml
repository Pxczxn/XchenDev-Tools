name: One-shot Projects shadcn Migration

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/project-control-fix.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Fix JSONC patch helper
        run: python .github/scripts/fix_shadcn_jsonc_patch.py

      - name: Apply shadcn migration
        run: python .github/scripts/shadcn_projects_patch.py

      - name: Install shadcn runtime dependencies
        run: npm install class-variance-authority clsx tailwind-merge lucide-react

      - name: Install Tailwind Vite dependencies
        run: npm install -D tailwindcss @tailwindcss/vite @types/node

      - name: Frontend tests
        run: npm test

      - name: Frontend build
        run: npm run build

      - name: Commit migration
        shell: pwsh
        run: |
          git config user.name "XchenDev"
          git config user.email "Pxczxn@163.com"
          git add package.json package-lock.json components.json tsconfig.json vite.config.ts src/layout/AppLayout.tsx src/styles/app.css src/styles/shadcn.css src/lib/utils.ts src/pages/ProjectsPage.tsx src/components/ui/button.tsx src/components/ui/card.tsx src/components/ui/badge.tsx src/components/ui/input.tsx
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "【ui】项目管理迁移 shadcn 并重构布局"
            git push
          } else {
            Write-Host "No changes"
          }
