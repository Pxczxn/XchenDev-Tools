name: One-shot Project Control Upgrade

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/project-control-fix.yml"

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Apply project control upgrade
        run: python .github/scripts/project_control_patch.py

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend tests
        run: npm test

      - name: Frontend build
        run: npm run build

      - name: Commit upgrade
        shell: pwsh
        run: |
          git config user.name "XchenDev"
          git config user.email "Pxczxn@163.com"
          git add src/pages/ProjectsPage.tsx src/styles/app.css src/lib/projectRuntime.ts src/lib/projectRuntime.test.ts
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "【feat】项目管理支持统一启停与运行摘要"
            git push
          } else {
            Write-Host "No changes"
          }
