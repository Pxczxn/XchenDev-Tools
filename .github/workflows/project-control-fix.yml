name: One-shot Project Control Upgrade

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/project-control-fix.yml"

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Add project runtime model and project-level controls
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime = '''import type { LaunchProfile, LaunchSessionInfo } from "../ipc/types";

const ACTIVE_SESSION_STATES = new Set(["STARTING", "RUNNING", "STOPPING"]);

export interface ProjectRuntimeSnapshot {
  activeSessions: LaunchSessionInfo[];
  startableProfiles: LaunchProfile[];
  stoppableSessions: LaunchSessionInfo[];
}

export function buildProjectRuntimeSnapshot(
  profiles: LaunchProfile[],
  sessionsById: Record<string, LaunchSessionInfo>,
): ProjectRuntimeSnapshot {
  const activeByProfile = new Map<string, LaunchSessionInfo>();

  for (const session of Object.values(sessionsById)) {
    if (!ACTIVE_SESSION_STATES.has(session.state)) continue;
    if (!activeByProfile.has(session.profile_id)) {
      activeByProfile.set(session.profile_id, session);
    }
  }

  const activeSessions = profiles.flatMap((profile) => {
    const session = activeByProfile.get(profile.profile_id);
    return session ? [session] : [];
  });
  const startableProfiles = profiles.filter(
    (profile) => !activeByProfile.has(profile.profile_id),
  );
  const stoppableSessions = activeSessions.filter(
    (session) => session.state !== "STOPPING",
  );

  return { activeSessions, startableProfiles, stoppableSessions };
}
'''
          Path("src/lib/projectRuntime.ts").write_text(runtime, encoding="utf-8", newline="\n")

          test = '''import { describe, expect, it } from "vitest";
import type { LaunchProfile, LaunchSessionInfo } from "../ipc/types";
import { buildProjectRuntimeSnapshot } from "./projectRuntime";

function profile(id: string): LaunchProfile {
  return {
    profile_id: id,
    project_id: "project-1",
    process_role: id,
    working_directory: ".",
    command: `run-${id}`,
    user_modified: false,
  };
}

function session(
  id: string,
  profileId: string,
  state: string,
): LaunchSessionInfo {
  return {
    launch_session_id: id,
    profile_id: profileId,
    state,
  };
}

describe("buildProjectRuntimeSnapshot", () => {
  it("separates active, startable and stoppable project entries", () => {
    const profiles = [profile("frontend"), profile("backend"), profile("worker")];
    const sessions = {
      s1: session("s1", "frontend", "RUNNING"),
      s2: session("s2", "backend", "STOPPING"),
      stale: session("stale", "worker", "STOPPED"),
      other: session("other", "other-project-profile", "RUNNING"),
    };

    const snapshot = buildProjectRuntimeSnapshot(profiles, sessions);

    expect(snapshot.activeSessions.map((item) => item.profile_id)).toEqual([
      "frontend",
      "backend",
    ]);
    expect(snapshot.startableProfiles.map((item) => item.profile_id)).toEqual([
      "worker",
    ]);
    expect(snapshot.stoppableSessions.map((item) => item.profile_id)).toEqual([
      "frontend",
    ]);
  });

  it("treats every profile as startable when the project has no active sessions", () => {
    const profiles = [profile("frontend"), profile("backend")];
    const snapshot = buildProjectRuntimeSnapshot(profiles, {});

    expect(snapshot.activeSessions).toEqual([]);
    expect(snapshot.stoppableSessions).toEqual([]);
    expect(snapshot.startableProfiles).toHaveLength(2);
  });
});
'''
