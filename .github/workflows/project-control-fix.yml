name: One-shot Project UI Polish

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/project-control-fix.yml"

permissions:
  contents: write

jobs:
  polish:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Apply project UI polish
        run: python .github/scripts/project_ui_patch.py

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend tests
        run: npm test

      - name: Frontend build
        run: npm run build

      - name: Commit polish
        shell: pwsh
        run: |
          git config user.name "XchenDev"
          git config user.email "Pxczxn@163.com"
          git add src/pages/ProjectsPage.tsx src/styles/app.css
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "【ui】优化项目管理控制台布局与视觉层级"
            git push
          } else {
            Write-Host "No changes"
          }
