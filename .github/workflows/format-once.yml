name: Rustfmt Once

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Ensure rustfmt
        run: rustup component add rustfmt

      - name: Format Rust sources
        run: cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet -- src-tauri; then
            echo "Rust sources already formatted."
            exit 0
          fi
          git config user.name "XchenDev CI"
          git config user.email "actions@github.com"
          git add src-tauri
          git commit -m "【style】统一 Rust 格式"
          git push
