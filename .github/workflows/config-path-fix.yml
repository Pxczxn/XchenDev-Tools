name: One-shot Config Path Fix

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/config-path-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Apply config path fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} match(es), found {actual} for {old!r}")
              p.write_text(text.replace(old, new, count), encoding="utf-8", newline="\n")

          replace_exact(
              "src-tauri/src/config_store/mod.rs",
              '''/// 默认：应用同目录下的 `config/config.json`。\n/// `tauri dev` 时解析到仓库根目录的 `config/`（可执行文件在 `src-tauri/target/*/debug`）。''',
              '''/// 默认配置位置：\n/// - 开发态（`tauri dev` / 仓库 target）：仓库根目录 `config/config.json`；\n/// - 安装态：`%LOCALAPPDATA%\\XchenDev-Tools\\config\\config.json`。\n/// `XCHEN_CONFIG_FILE`、`XCHEN_CONFIG_DIR`、`XCHEN_TOOLS_HOME` 可显式覆盖默认位置。''',
          )

          replace_exact(
              "src-tauri/src/config_store/mod.rs",
              '''fn app_base_dir() -> PathBuf {\n    if let Ok(home) = std::env::var("XCHEN_TOOLS_HOME") {\n        return PathBuf::from(home);\n    }\n    if let Ok(exe) = std::env::current_exe() {\n        if let Some(project_root) = project_root_from_exe(&exe) {\n            return project_root;\n        }\n        if let Some(parent) = exe.parent() {\n            return parent.to_path_buf();\n        }\n    }\n    std::env::current_dir().unwrap_or_else(|_| PathBuf::from("."))\n}\n''',
              '''fn app_base_dir() -> PathBuf {\n    let custom_home = std::env::var("XCHEN_TOOLS_HOME").ok();\n    let executable = std::env::current_exe().ok();\n    let local_app_data = std::env::var("LOCALAPPDATA").ok();\n    let current_dir = std::env::current_dir().unwrap_or_else(|_| PathBuf::from("."));\n\n    resolve_app_base_dir(\n        custom_home.as_deref(),\n        executable.as_deref(),\n        local_app_data.as_deref(),\n        &current_dir,\n    )\n}\n\nfn resolve_app_base_dir(\n    custom_home: Option<&str>,\n    executable: Option<&Path>,\n    local_app_data: Option<&str>,\n    current_dir: &Path,\n) -> PathBuf {\n    if let Some(home) = custom_home {\n        return PathBuf::from(home);\n    }\n    if let Some(exe) = executable {\n        if let Some(project_root) = project_root_from_exe(exe) {\n            return project_root;\n        }\n    }\n    if let Some(local) = local_app_data.map(str::trim).filter(|value| !value.is_empty()) {\n        return PathBuf::from(local).join("XchenDev-Tools");\n    }\n    if let Some(parent) = executable.and_then(Path::parent) {\n        return parent.to_path_buf();\n    }\n    current_dir.to_path_buf()\n}\n''',
          )

          marker = '''    #[test]\n    fn import_integrity_accepts_valid_project_profile_graph() {'''
          tests = '''    #[test]\n    fn base_dir_explicit_home_has_highest_priority() {\n        let executable = PathBuf::from("repo")\n            .join("src-tauri")\n            .join("target")\n            .join("debug")\n            .join("xchendev-tools.exe");\n        let resolved = resolve_app_base_dir(\n            Some("D:\\\\Portable\\\\XchenDev-Tools"),\n            Some(&executable),\n            Some("C:\\\\Users\\\\demo\\\\AppData\\\\Local"),\n            Path::new("fallback"),\n        );\n        assert_eq!(resolved, PathBuf::from("D:\\\\Portable\\\\XchenDev-Tools"));\n    }\n\n    #[test]\n    fn base_dir_dev_repository_wins_over_local_app_data() {\n        let executable = PathBuf::from("repo")\n            .join("src-tauri")\n            .join("target")\n            .join("debug")\n            .join("xchendev-tools.exe");\n        let resolved = resolve_app_base_dir(\n            None,\n            Some(&executable),\n            Some("C:\\\\Users\\\\demo\\\\AppData\\\\Local"),\n            Path::new("fallback"),\n        );\n        assert_eq!(resolved, PathBuf::from("repo"));\n    }\n\n    #[test]\n    fn base_dir_installed_app_uses_local_app_data() {\n        let executable = PathBuf::from("C:\\\\Program Files\\\\XchenDev-Tools\\\\XchenDev-Tools.exe");\n        let resolved = resolve_app_base_dir(\n            None,\n            Some(&executable),\n            Some("C:\\\\Users\\\\demo\\\\AppData\\\\Local"),\n            Path::new("fallback"),\n        );\n        assert_eq!(\n            resolved,\n            PathBuf::from("C:\\\\Users\\\\demo\\\\AppData\\\\Local").join("XchenDev-Tools")\n        );\n    }\n\n'''
          p = Path("src-tauri/src/config_store/mod.rs")
          text = p.read_text(encoding="utf-8")
          if text.count(marker) != 1:
              raise SystemExit("config_store test insertion marker mismatch")
          p.write_text(text.replace(marker, tests + marker, 1), encoding="utf-8", newline="\n")

          replace_exact(
              "src/pages/SettingsPage.tsx",
              '''        setConfigDir("（应用同目录）/config");\n        setConfigFile("（应用同目录）/config/config.json");''',
              '''        setConfigDir("（无法读取实际配置目录）");\n        setConfigFile("（无法读取实际配置文件）");''',
          )
          replace_exact(
              "src/pages/SettingsPage.tsx",
              '''          默认目录为应用同目录下的 <code>config</code>，主文件为{" "}\n          <code>config.json</code>。''',
              '''          开发态默认保存到仓库根目录的 <code>config</code>；安装版默认保存到{" "}\n          <code>%LOCALAPPDATA%\\XchenDev-Tools\\config</code>。环境变量覆盖优先。''',
          )
          PY

      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Rust clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml -- --test-threads=1

      - name: Frontend tests
        run: |
          npm ci
          npm test
          npm run build

      - name: Commit fix
        shell: pwsh
        run: |
          git config user.name "XchenDev"
          git config user.email "Pxczxn@163.com"
          git add src-tauri/src/config_store/mod.rs src/pages/SettingsPage.tsx
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "【fix】安装版配置改存本机应用数据目录"
            git push
          } else {
            Write-Host "No changes"
          }
