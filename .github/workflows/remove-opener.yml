name: One-shot Remove Unused Opener

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/remove-opener.yml"

permissions:
  contents: write

jobs:
  remove-opener:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Remove frontend opener dependency
        run: npm uninstall @tauri-apps/plugin-opener

      - name: Remove Rust opener dependency
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src-tauri/Cargo.toml")
          text = path.read_text(encoding="utf-8")
          old = 'tauri-plugin-opener = "2"\n'
          if text.count(old) != 1:
              raise SystemExit(f"expected one opener dependency, found {text.count(old)}")
          path.write_text(text.replace(old, "", 1), encoding="utf-8", newline="\n")
          PY

      - name: Refresh Cargo lockfile
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Frontend dependency audit
        run: npm audit --audit-level=moderate

      - name: Frontend tests
        run: npm test

      - name: Frontend build
        run: npm run build

      - name: Rust format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Rust clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml -- --test-threads=1

      - name: Tauri application build
        run: npm run tauri build -- --no-bundle

      - name: Commit dependency cleanup
        shell: pwsh
        run: |
          git config user.name "XchenDev"
          git config user.email "Pxczxn@163.com"
          git add package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "【cleanup】移除未使用的 opener 依赖"
            git push
          }
