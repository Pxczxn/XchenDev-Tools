name: One-shot Config Path Finalize

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/config-path-finalize.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Patch final config location
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path("src-tauri/src/config_store/mod.rs"): [
                  (
                      '/// - 安装态：`%LOCALAPPDATA%\\\\XchenDev\\\\XchenDev-Tools\\\\config\\\\config.json`。',
                      '/// - 安装态：`%LOCALAPPDATA%\\\\XchenDev-Tools\\\\config\\\\config.json`。',
                  ),
                  (
                      '        return PathBuf::from(local).join("XchenDev").join("XchenDev-Tools");',
                      '        return PathBuf::from(local).join("XchenDev-Tools");',
                  ),
                  (
                      '            PathBuf::from("C:\\\\Users\\\\demo\\\\AppData\\\\Local")\n                .join("XchenDev")\n                .join("XchenDev-Tools")',
                      '            PathBuf::from("C:\\\\Users\\\\demo\\\\AppData\\\\Local")\n                .join("XchenDev-Tools")',
                  ),
              ],
              Path("src/pages/SettingsPage.tsx"): [
                  (
                      '<code>%LOCALAPPDATA%\\\\XchenDev\\\\XchenDev-Tools\\\\config</code>，与安装目录隔离。环境变量覆盖优先。',
                      '<code>%LOCALAPPDATA%\\\\XchenDev-Tools\\\\config</code>，与安装目录隔离。环境变量覆盖优先。',
                  ),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"{path}: expected one match for {old!r}, found {count}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8", newline="\n")
          PY

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend tests
        run: npm test

      - name: Frontend build
        run: npm run build

      - name: Rust format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Rust clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml -- --test-threads=1

      - name: Commit config location
        shell: pwsh
        run: |
          git config user.name "XchenDev"
          git config user.email "Pxczxn@163.com"
          git add src-tauri/src/config_store/mod.rs src/pages/SettingsPage.tsx
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "【fix】统一安装态配置目录到 LocalAppData"
            git push
          }
